<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace a Facebook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .boton-enlace {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4267B2; /* Color azul de Facebook */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .boton-enlace:hover {
            background-color: #365899;
        }
    </style>
</head>
<body>

    <h1>Mi Enlace de Facebook</h1>

    <a 
        href="https://www.facebook.com/profile.php?id=61577232629250" 
        target="_blank" 
        class="boton-enlace"
    >
        ¡Visita mi Perfil en Facebook!
    </a>

    <p style="margin-top: 30px;">
        Haz clic en el botón para ser dirigido al perfil.
    </p>

</body>
</html>
