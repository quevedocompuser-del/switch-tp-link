<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Mikrotik - Catálogo Oficial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4; /* Fondo claro */
        }
        h1 {
            color: #007bff; /* Un azul asociado a tecnología/internet */
        }
        .boton-enlace {
            display: inline-block;
            padding: 15px 30px; /* Un poco más grande para destacar */
            background-color: #007bff; /* Azul primario */
            color: white;
            text-decoration: none;
            border-radius: 8px; /* Bordes redondeados */
            font-size: 20px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .boton-enlace:hover {
            background-color: #0056b3; /* Tono más oscuro al pasar el mouse */
            transform: translateY(-2px); /* Pequeño efecto 3D al pasar el mouse */
        }
    </style>
</head>
<body>

    <h1>🛒 Catálogo de Productos Mikrotik 📡</h1>

    <a
        href="https://mikrotik.com/products" target="_blank"
        class="boton-enlace"
    >
        ¡Explora Routers y Switches Ahora!
    </a>

    <p style="margin-top: 30px; color: #555;">
        Haz clic en el botón superior para ver todos los equipos, incluyendo
        Routers, Switches, y soluciones inalámbricas.
    </p>

    </body>
</html>
